name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: ${{ matrix.os }} ${{ matrix.compiler }} ${{ matrix.precision }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
        compiler: [g++, clang++]
        precision: [double, single]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=${{ matrix.compiler }} -DCMAKE_C_COMPILER=${{ matrix.compiler == 'clang++' && 'clang' || 'gcc' }} -DMS110D_PRECISION=${{ matrix.precision }} -DMS110D_DOTNET_TESTS=OFF
      - name: Build
        run: cmake --build build -j4
      - name: Test
        run: ctest --test-dir build --output-on-failure

  sanitizers:
    name: sanitizers (address, undefined)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer" -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer" -DMS110D_DOTNET_TESTS=OFF
      - name: Build
        run: cmake --build build -j4
      - name: Test
        run: ctest --test-dir build --output-on-failure

  consumers:
    name: consumer projects (${{ matrix.precision }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        precision: [double, single]
    steps:
      - uses: actions/checkout@v4
      - name: FetchContent and find_package consumers
        run: tests/consumer/run.sh "$RUNNER_TEMP/consumers" -DMS110D_PRECISION=${{ matrix.precision }}

  cortex-m7:
    name: cortex-m7 compile check (${{ matrix.precision }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        precision: [double, single]
    steps:
      - uses: actions/checkout@v4
      - name: Install arm-none-eabi-gcc
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-arm-none-eabi libstdc++-arm-none-eabi-newlib
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE=cmake/toolchains/cortex-m7.cmake -DMS110D_PRECISION=${{ matrix.precision }} -DMS110D_BUILD_TESTS=OFF -DMS110D_INSTALL=OFF
      - name: Build the library
        run: cmake --build build -j4
      - name: Check the C boundary types are fixed width on this target
        run: arm-none-eabi-gcc -std=c11 -mcpu=cortex-m7 -mthumb -mfpu=fpv5-d16 -mfloat-abi=hard -Wall -Wextra -Werror -Iinclude -c tests/c_layout_check.c -o /dev/null

  interop:
    name: .NET interop tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DMS110D_DOTNET_TESTS=ON
      - name: Build the library and the C test
        run: cmake --build build -j4
      - name: Test (C test and the .NET tests against the shared library)
        run: ctest --test-dir build --output-on-failure

  reference:
    name: reference files
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Cache the reference files
        uses: actions/cache@v4
        with:
          path: build/_reference
          key: reference-${{ hashFiles('reference/pin.txt', 'scripts/generate-reference.sh') }}
      - name: Generate and verify
        run: scripts/generate-reference.sh
      - name: Regenerate the committed C# dumps and fail on any difference
        run: scripts/check-dumps.sh "$GITHUB_WORKSPACE/build/_reference/ref"
      - name: Cache the Poor channel corpus
        uses: actions/cache@v4
        with:
          path: |
            build/_reference/wn0-poor.txt
            build/_reference/wn0-poor.i16le
            build/_reference/wn0-poor.stamp
          key: wn0-poor-${{ hashFiles('reference/pin.txt', 'scripts/generate-wn0-poor.sh', 'tools/csharp-vectors/*.cs', 'tools/csharp-vectors/*.csproj') }}
      - name: Generate the Poor channel corpus
        run: scripts/generate-wn0-poor.sh
      - name: Cache the receive dumps
        uses: actions/cache@v4
        with:
          path: |
            build/_reference/csharp-rx.txt
            build/_reference/csharp-rx-awgn.txt
            build/_reference/rx-dumps.stamp
          key: rx-dumps-${{ hashFiles('reference/pin.txt', 'scripts/generate-rx-dumps.sh', 'tools/csharp-vectors/*.cs', 'tools/csharp-vectors/*.csproj') }}
      - name: Generate the receive dumps
        run: scripts/generate-rx-dumps.sh
      - name: Configure the library and tests
        run: cmake -S . -B build/tests -DCMAKE_BUILD_TYPE=Release -DMS110D_DOTNET_TESTS=OFF -DMS110D_REFERENCE_DIR="$GITHUB_WORKSPACE/build/_reference/ref" -DMS110D_WN0_POOR_STEM="$GITHUB_WORKSPACE/build/_reference/wn0-poor" -DMS110D_RX_DUMP_DIR="$GITHUB_WORKSPACE/build/_reference"
      - name: Build the tests
        run: cmake --build build/tests -j4
      - name: Run the tests that use the reference files (must not skip)
        env:
          MS110D_REQUIRE_REFERENCE: "1"
        run: ctest --test-dir build/tests --output-on-failure -R "^reference " --no-tests=error
      - name: Configure the single precision build
        run: cmake -S . -B build/tests-single -DCMAKE_BUILD_TYPE=Release -DMS110D_PRECISION=single -DMS110D_DOTNET_TESTS=OFF -DMS110D_REFERENCE_DIR="$GITHUB_WORKSPACE/build/_reference/ref" -DMS110D_WN0_POOR_STEM="$GITHUB_WORKSPACE/build/_reference/wn0-poor" -DMS110D_RX_DUMP_DIR="$GITHUB_WORKSPACE/build/_reference"
      - name: Build the single precision tests
        run: cmake --build build/tests-single -j4
      - name: Run the reference tests in single precision (must not skip)
        env:
          MS110D_REQUIRE_REFERENCE: "1"
        run: ctest --test-dir build/tests-single --output-on-failure -R "^reference " --no-tests=error
