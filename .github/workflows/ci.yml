name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    name: ${{ matrix.os }} ${{ matrix.compiler }} ${{ matrix.precision }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
        compiler: [g++, clang++]
        precision: [double, single]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=${{ matrix.compiler }} -DMS110D_PRECISION=${{ matrix.precision }}
      - name: Build
        run: cmake --build build -j4
      - name: Test
        run: ctest --test-dir build --output-on-failure

  sanitizers:
    name: sanitizers (address, undefined)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer"
      - name: Build
        run: cmake --build build -j4
      - name: Test
        run: ctest --test-dir build --output-on-failure

  consumers:
    name: consumer projects
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: FetchContent and find_package consumers
        run: tests/consumer/run.sh "$RUNNER_TEMP/consumers"

  cortex-m7:
    name: cortex-m7 compile check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install arm-none-eabi-gcc
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-arm-none-eabi
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE=cmake/toolchains/cortex-m7.cmake -DMS110D_BUILD_TESTS=OFF -DMS110D_INSTALL=OFF
      - name: Build the library
        run: cmake --build build -j4
