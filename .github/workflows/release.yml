name: release

# Cuts a release on a v<MAJOR>.<MINOR>.<PATCH> tag: checks the tag matches the CMake project
# version, runs the full CI, then builds a source archive with a SHA-256 file and creates a
# GitHub release with generated notes. Nothing is published to a package registry.
# See docs/versioning.md.
on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  check-version:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify the tagged commit is on main
        run: |
          set -euo pipefail
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tagged commit $GITHUB_SHA is not on main. Releases are cut from main only (docs/versioning.md)."
            exit 1
          fi
      - name: Verify tag matches the CMake project version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          version="$(grep -oPm1 '^project\(m0lte-ms110d VERSION \K[0-9]+\.[0-9]+\.[0-9]+' CMakeLists.txt)"
          echo "tag=$tag  project version=$version"
          if [ "$tag" != "$version" ]; then
            echo "::error::Tag v$tag does not match the project version $version in CMakeLists.txt. Bump the version in the same commit as the tag (docs/versioning.md)."
            exit 1
          fi

  ci:
    needs: check-version
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build the source archive
        run: |
          set -euo pipefail
          name="m0lte-ms110d-${GITHUB_REF_NAME#v}"
          git archive --format=tar.gz --prefix="$name/" -o "$name.tar.gz" "$GITHUB_REF_NAME"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
          cat "$name.tar.gz.sha256"
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" m0lte-ms110d-*.tar.gz m0lte-ms110d-*.tar.gz.sha256 --title "$GITHUB_REF_NAME" --generate-notes
