name: C# parity

# Weekly: is there a C# release newer than the pin, and how far is the C++ from it? Plus random
# streams through both receivers with fresh seeds. Opens or updates an issue when there is
# something to do. docs/dev/parity.md.
on:
  schedule:
    - cron: "23 4 * * 1"  # Mondays, 04:23 UTC
  workflow_dispatch:
    inputs:
      version:
        description: "C# version to check against (default: the newest on NuGet)"
        required: false
        default: ""

permissions:
  contents: read
  issues: write

jobs:
  parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -- --modify-checkout
          if [ -n "${{ inputs.version }}" ]; then set -- "$@" --version "${{ inputs.version }}"; fi
          scripts/parity-check.sh "$@" build/report/parity.md
      - name: Summary
        if: always()
        run: cat build/report/parity.md >> "$GITHUB_STEP_SUMMARY" || true
      - name: Open or update the issue
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status=$(cat build/report/STATUS)
          echo "status: $status"
          [ "$status" = current ] && exit 0
          title=$(head -1 build/report/parity.md | sed 's/^# //')
          body="$(cat build/report/parity.md)

          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          gh label create parity --color 5319e7 --description "C# parity check" 2>/dev/null || true
          n=$(gh issue list --label parity --state open --search "\"$title\" in:title" --json number -q '.[0].number')
          if [ -n "$n" ]; then
            gh issue comment "$n" --body "$body"
          else
            gh issue create --label parity --title "$title" --body "$body"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: parity
          path: |
            build/report
            build/parity/*.log
          if-no-files-found: ignore
